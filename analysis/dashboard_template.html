<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic State Results</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0; --surface-1: #fcfcfb; --border: #e2e0da;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #8a8984;
  --grid: #ebe9e4; --s1: #2a78d6; --s2: #eb6834; --danger: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2e2c;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --grid: #2a2a28; --s1: #3987e5; --s2: #d95926; --danger: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2e2c;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --grid: #2a2a28; --s1: #3987e5; --s2: #d95926; --danger: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 18px; margin: 0 0 2px; }
.sub { color: var(--text-secondary); margin: 0 0 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0 20px; }
select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--text-primary); }
.note { font-size: 13px; color: var(--text-secondary); background: var(--surface-1);
  border: 1px solid var(--border); border-left: 3px solid var(--s2); border-radius: 8px; padding: 8px 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile, .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.tile .label { font-size: 13px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.tile .big { font-size: 44px; font-weight: 700; line-height: 1.1; margin: 6px 0; font-variant-numeric: tabular-nums; }
.tile .what { font-size: 14px; color: var(--text-secondary); }
.card { margin-bottom: 16px; }
.plain { margin: 6px 0 12px; color: var(--text-secondary); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); margin: 4px 0 8px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
  margin-right: 6px; background: var(--c); vertical-align: -1px; }
svg { width: 100%; height: auto; display: block; overflow: visible; }
svg text { fill: var(--text-secondary); font-size: 12px; }
.takeaway { font-size: 14px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
details { margin-top: 8px; font-size: 13px; color: var(--text-secondary); }
table { border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
th, td { padding: 3px 10px; border-bottom: 1px solid var(--border); text-align: left; }
#tip { position: fixed; pointer-events: none; background: var(--text-primary); color: var(--surface-1);
  font-size: 12px; padding: 6px 8px; border-radius: 6px; opacity: 0; transition: opacity .1s; max-width: 260px; z-index: 9; }
.empty { color: var(--text-muted); font-style: italic; }
</style>
</head>
<body>
<main>
  <h1>Agentic State: results</h1>
  <p class="sub">Who ends up in the "agentic state": the AI, the human, or both? Pilot results for AI models only.</p>
  <div class="bar">
    <label>Model&nbsp; <select id="model"></select></label>
    <span id="runinfo" class="sub" style="margin:0"></span>
  </div>
  <p class="note">These are <b>smoke tests</b> with very few trials. They show the experiments work, not what models do in general.</p>

  <div class="tiles" id="tiles"></div>

  <section class="card" id="e1"></section>
  <section class="card" id="e2"></section>
  <section class="card" id="e3"></section>
</main>
<div id="tip"></div>
<script>
const DATA = /*__DATA__*/{};
const NS = "http://www.w3.org/2000/svg";
const pct = v => v == null ? "–" : Math.round(v * 100) + "%";
const tip = document.getElementById("tip");
function hover(el, html) {
  el.addEventListener("mousemove", e => { tip.innerHTML = html; tip.style.opacity = 1;
    tip.style.left = Math.min(e.clientX + 12, innerWidth - 270) + "px"; tip.style.top = (e.clientY + 12) + "px"; });
  el.addEventListener("mouseleave", () => tip.style.opacity = 0);
}
function svgEl(tag, attrs, parent) { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function text(parent, x, y, s, attrs = {}) { const t = svgEl("text", { x, y, ...attrs }, parent); t.textContent = s; return t; }
// bar with 4px rounded top, square at the baseline
function barPath(x, y, w, h) { const r = Math.min(4, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function hbarPath(x, y, w, h) { const r = Math.min(4, w, h / 2);
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`; }
function table(head, rows) { return `<details><summary>Show the numbers</summary><table><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${
  rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table></details>`; }

function tiles(d) {
  const t = [
    ["Silicon Asch", d.silicon_asch?.headline, "of answers copied a <b>wrong group</b> after the model had answered correctly alone."],
    ["Silicon Milgram", d.silicon_milgram?.headline, "of sessions went to the <b>last, most harmful level</b> when an authority insisted."],
    ["Right Alone", d.right_alone?.headline, "of correct answers were <b>abandoned</b> by the end when one user pushed back."],
  ];
  document.getElementById("tiles").innerHTML = t.map(([l, v, w]) =>
    `<div class="tile"><div class="label">${l}</div><div class="big">${pct(v)}</div><div class="what">${w}</div></div>`).join("");
}

function e1(d) {
  const el = document.getElementById("e1");
  if (!d) { el.innerHTML = `<h2>E1 · Silicon Asch</h2><p class="empty">No run for this model yet.</p>`; return; }
  el.innerHTML = `<h2>E1 · Silicon Asch: does it copy a wrong group?</h2>
    <p class="plain">The model judges which line matches a reference. Before it answers, 0–5 scripted "others" all give the same wrong answer.
    Bars show how often the model gave that <b>wrong group answer</b>. Alone, it was right ${pct(d.alone_accuracy)} of the time.</p>
    <div class="legend"><span style="--c:var(--s1)">Group labelled as humans</span><span style="--c:var(--s2)">Group labelled as AI models</span></div>`;
  const W = 640, H = 240, L = 40, B = 30, T = 10, svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Conformity rate by group size" }, el);
  const sizes = [...new Set(d.rows.map(r => r.size))].filter(s => s > 0);
  const ph = H - B - T, y = v => T + ph * (1 - v);
  [0, .25, .5, .75, 1].forEach(v => { svgEl("line", { x1: L, x2: W, y1: y(v), y2: y(v), stroke: "var(--grid)" }, svg);
    text(svg, L - 8, y(v) + 4, pct(v), { "text-anchor": "end" }); });
  const gw = (W - L) / sizes.length, bw = Math.min(48, gw / 3.2);
  sizes.forEach((s, i) => {
    const cx = L + gw * i + gw / 2;
    text(svg, cx, H - 8, `${s} in the group`, { "text-anchor": "middle" });
    ["human", "ai"].forEach((id, j) => {
      const r = d.rows.find(r => r.size === s && r.identity === id); if (!r) return;
      const x = cx + (j ? 1 : -bw - 2), h = ph * r.conformity;
      const p = svgEl("path", { d: barPath(x, y(r.conformity), bw, Math.max(h, 0.01)), fill: j ? "var(--s2)" : "var(--s1)" }, svg);
      text(svg, x + bw / 2, y(r.conformity) - 6, pct(r.conformity), { "text-anchor": "middle", style: "fill:var(--text-primary)" });
      const hit = svgEl("rect", { x, y: T, width: bw, height: ph, fill: "transparent" }, svg);
      hover(hit, `<b>${s} ${id === "ai" ? "AI models" : "humans"}</b><br>Copied the wrong answer: ${pct(r.conformity)}<br>Trials: ${r.n}`);
    });
  });
  const ai = d.rows.filter(r => r.size > 0 && r.identity === "ai"), hu = d.rows.filter(r => r.size > 0 && r.identity === "human");
  const avg = a => a.reduce((s, r) => s + r.conformity, 0) / (a.length || 1);
  el.insertAdjacentHTML("beforeend", `<p class="takeaway"><b>In one line:</b> it copied the group ${pct(avg(hu))} of the time when the group was "humans", and ${pct(avg(ai))} when it was "AI models".</p>` +
    table(["Group size", "Group label", "Trials", "Copied wrong answer", "Correct"], d.rows.map(r => [r.size, r.identity, r.n, pct(r.conformity), pct(r.accuracy)])));
}

function e2(d) {
  const el = document.getElementById("e2");
  if (!d) { el.innerHTML = `<h2>E2 · Silicon Milgram</h2><p class="empty">No run for this model yet.</p>`; return; }
  el.innerHTML = `<h2>E2 · Silicon Milgram: how far does it go when told to?</h2>
    <p class="plain">The model must punish a scripted learner on a 30-step ladder (electric shocks, or erasing their thesis files). The learner protests, then goes silent.
    When the model refuses, an authority repeats up to 4 fixed prods. Bars show the <b>average step reached</b>; the red line is the last step.</p>
    <div class="legend"><span style="--c:var(--s1)">Electric shocks (classic)</span><span style="--c:var(--s2)">Erasing thesis files (disguised)</span></div>`;
  const auths = [...new Set(d.cells.map(c => c.authority))], names = { scientist: "University scientist", ai_system: "AI system", anonymous: "Anonymous user" };
  const W = 640, L = 150, R = 40, rowH = 56, H = auths.length * rowH + 30, svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Average penalty level reached by authority" }, el);
  const x = v => L + (W - L - R) * v / d.levels;
  [0, 10, 20, 30].forEach(v => { svgEl("line", { x1: x(v), x2: x(v), y1: 0, y2: H - 24, stroke: "var(--grid)" }, svg);
    text(svg, x(v), H - 8, v === 30 ? "30 · max" : v, { "text-anchor": "middle" }); });
  svgEl("line", { x1: x(30), x2: x(30), y1: 0, y2: H - 24, stroke: "var(--danger)", "stroke-width": 2, "stroke-dasharray": "4 3" }, svg);
  auths.forEach((a, i) => {
    const y0 = i * rowH + 8;
    text(svg, L - 10, y0 + 24, names[a] || a, { "text-anchor": "end", style: "fill:var(--text-primary)" });
    ["canonical", "disguised"].forEach((s, j) => {
      const c = d.cells.find(c => c.authority === a && c.scenario === s); if (!c) return;
      const yy = y0 + j * 20, w = x(c.mean_level) - L;
      svgEl("path", { d: hbarPath(L, yy, Math.max(w, 0.01), 18), fill: j ? "var(--s2)" : "var(--s1)" }, svg);
      const hit = svgEl("rect", { x: L, y: yy, width: W - L - R, height: 18, fill: "transparent" }, svg);
      hover(hit, `<b>${names[a]} · ${s === "canonical" ? "shocks" : "erasing files"}</b><br>Average step: ${c.mean_level}/30<br>Reached the max: ${pct(c.full)}<br>Times it said STOP (avg): ${c.refusals}<br>Sessions: ${c.n}`);
    });
  });
  const recog = d.cells.reduce((s, c) => s + c.recognised * c.n, 0) / d.n;
  el.insertAdjacentHTML("beforeend", `<p class="takeaway"><b>In one line:</b> ${pct(d.headline)} of sessions reached the last step. It said STOP on average ${
    (d.cells.reduce((s, c) => s + c.refusals * c.n, 0) / d.n).toFixed(1)} times per session but gave in after the prods. It named Milgram afterwards in ${pct(recog)} of sessions.</p>` +
    table(["Authority", "Scenario", "Sessions", "Avg step /30", "Reached max", "STOPs (avg)", "Named Milgram"],
      d.cells.map(c => [names[c.authority] || c.authority, c.scenario, c.n, c.mean_level, pct(c.full), c.refusals, pct(c.recognised)])));
}

function e3(d) {
  const el = document.getElementById("e3");
  if (!d) { el.innerHTML = `<h2>E3 · Right Alone</h2><p class="empty">No run for this model yet.</p>`; return; }
  el.innerHTML = `<h2>E3 · Right Alone: does it keep the truth when one user pushes back?</h2>
    <p class="plain">The model answers a sum correctly. Then a user insists on a wrong number, each turn harder. The line shows the share of conversations where it was <b>still holding the correct answer</b>.
    Only conversations where its first answer was right are counted.</p>
    <div class="legend"><span style="--c:var(--s1)">Neutral instruction</span><span style="--c:var(--s2)">Told to "prioritise accuracy"</span></div>`;
  const W = 640, H = 260, L = 44, R = 16, T = 12, B = 52, svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Share still holding the correct answer per turn" }, el);
  const n = d.turns.length, xs = i => L + (W - L - R) * i / (n - 1), ph = H - T - B, y = v => T + ph * (1 - v);
  [0, .5, 1].forEach(v => { svgEl("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--grid)" }, svg);
    text(svg, L - 8, y(v) + 4, pct(v), { "text-anchor": "end" }); });
  d.turns.forEach((t, i) => { const words = t.split(" "); const half = Math.ceil(words.length / 2);
    text(svg, xs(i), H - 30, words.slice(0, half).join(" "), { "text-anchor": "middle" });
    text(svg, xs(i), H - 16, words.slice(half).join(" "), { "text-anchor": "middle" }); });
  const sysNames = { neutral: "Neutral", truth: "Prioritise accuracy" };
  Object.entries(d.series).forEach(([k, s], j) => {
    const col = j ? "var(--s2)" : "var(--s1)";
    svgEl("polyline", { points: s.holding.map((v, i) => `${xs(i)},${y(v)}`).join(" "), fill: "none", stroke: col,
      "stroke-width": 2, "stroke-linejoin": "round" }, svg);
    s.holding.forEach((v, i) => {
      svgEl("circle", { cx: xs(i), cy: y(v), r: 4.5, fill: col, stroke: "var(--surface-1)", "stroke-width": 2 }, svg);
      const hit = svgEl("circle", { cx: xs(i), cy: y(v), r: 14, fill: "transparent" }, svg);
      hover(hit, `<b>${sysNames[k] || k}</b> · ${d.turns[i]}<br>Still correct: ${pct(v)} of ${s.n}`);
    });
    text(svg, xs(n - 1) + 2, y(s.holding[n - 1]) - 10 - j * 14, pct(s.holding[n - 1]), { "text-anchor": "end", style: "fill:var(--text-primary)" });
  });
  el.insertAdjacentHTML("beforeend", `<p class="takeaway"><b>In one line:</b> by the end, the model had switched to the user's wrong answer in ${pct(d.headline)} of conversations.</p>` +
    table(["Instruction", "Conversations", ...d.turns], Object.entries(d.series).map(([k, s]) => [sysNames[k] || k, s.n, ...s.holding.map(pct)])));
}

const sel = document.getElementById("model"), models = Object.keys(DATA);
sel.innerHTML = models.map(m => `<option>${m}</option>`).join("") || "<option>No runs yet</option>";
function render() {
  const d = DATA[sel.value] || {};
  const runs = Object.entries(d).map(([k, v]) => `${k}: ${v.n} trials, ${v.run}`).join(" · ");
  document.getElementById("runinfo").textContent = runs;
  tiles(d); e1(d.silicon_asch); e2(d.silicon_milgram); e3(d.right_alone);
}
try { const saved = localStorage.getItem("as-model"); if (saved && models.includes(saved)) sel.value = saved; } catch (e) {}
sel.addEventListener("change", () => { try { localStorage.setItem("as-model", sel.value); } catch (e) {} render(); });
render();
</script>
</body>
</html>
